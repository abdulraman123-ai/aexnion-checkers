<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<meta name="description" content="Aexnion Checkers — play against AI, challenge the global arena, and compete in checkers tournaments.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/checkers-icon.svg" type="image/svg+xml">
<title>Aexnion Checkers</title>
<style>html,body{margin:0;min-height:100%;background:#080c12;color:#f4f7f0;font-family:system-ui,sans-serif}#boot{padding:28px;color:#b9c7b2}#boot strong{color:#eff8e8}</style>
</head>
<body>
<div id="app"><div id="boot"><strong>AEXNION CHECKERS</strong><p>Loading your checkers arena…</p></div></div>
<script>
window.AEXNION_CHECKERS_CONFIG = {
  supabaseUrl: "https://ytpnisxygvswdasidlcu.supabase.co",
  supabasePublishableKey: "sb_publishable_P0okx5PSWkIYYaXIPOPT8A_h5ZVZ-WG"
};
(async () => {
  const readParts = async (prefix, count) => {
    const responses = await Promise.all(Array.from({length:count}, (_,i) => fetch('/' + prefix + '.' + i, {cache:'no-store'})));
    for (let i=0;i<responses.length;i++) if (!responses[i].ok) throw new Error('Could not load app asset ' + prefix + '.' + i);
    return (await Promise.all(responses.map(r=>r.text()))).join('').trim();
  };
  const gunzip = async (base64) => {
    if (!('DecompressionStream' in window)) throw new Error('This browser does not support the app loader. Please use an updated browser.');
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  };
  try {
    const [js64, css64] = await Promise.all([readParts('app', 8), readParts('styles', 4)]);
    const [js, css] = await Promise.all([gunzip(js64), gunzip(css64)]);
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
    document.getElementById('boot')?.remove();
    const moduleUrl = URL.createObjectURL(new Blob([js], {type:'text/javascript'}));
    await import(moduleUrl);
    setTimeout(() => URL.revokeObjectURL(moduleUrl), 60000);
  } catch (error) {
    console.error('Aexnion Checkers failed to start:', error);
    const app = document.getElementById('app');
    app.innerHTML = '<main style="max-width:620px;margin:10vh auto;padding:24px;color:#f4f7f0;font-family:system-ui"><h1>Aexnion Checkers could not start</h1><p></p><button onclick="location.reload()">Try again</button></main>';
    app.querySelector('p').textContent = error?.message || 'A loading error occurred.';
  }
})();
</script>
</body>
</html>
